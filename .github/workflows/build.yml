name: Build AspenBlue Base

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read
  packages: write

concurrency:
  group: hyprite-build
  cancel-in-progress: true

jobs:

  build:

    strategy:
      matrix:
        recipe:
          - base

    name: Build ${{ matrix.recipe }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      # Основной репозиторий
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        uses: blue-build/github-action@v1
        with:
          recipe: ${{ matrix.recipe }}.yml
          skip_checkout: true
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          maximize_build_space: true