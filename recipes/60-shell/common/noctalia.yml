---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:

  # -----------------------------------------------
  # Noctalia packages
  # -----------------------------------------------

  - type: dnf
    install:
      install-weak-deps: false
      packages:
        # Noctalia
        - noctalia         

  # -----------------------------------------------
  # Noctalia - configuration
  # -----------------------------------------------

  - type: files
    files:
      - source: rootfs/noctalia
        destination: /
