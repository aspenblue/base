---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:

  # -----------------------------------------------
  # Terra repository
  # -----------------------------------------------

  - type: dnf
    repos:
      files:
        # - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
        - https://raw.githubusercontent.com/terrapkg/packages/f44/anda/terra/release/terra.repo


  # -----------------------------------------------
  # Greeter packages
  # -----------------------------------------------

  - type: dnf
    install:
      install-weak-deps: false
      packages:
        # Login / greeter
        - greetd
        
        # Noctalia greeter
        - noctalia-greeter


  # -----------------------------------------------
  # Enable greetd
  # -----------------------------------------------

  - type: systemd
    system:
      enabled:
        - greetd.service


  # -----------------------------------------------
  # Noctalia greeter - configuration
  # -----------------------------------------------

  - type: files
    files:
      - source: rootfs/noctalia-greeter
        destination: /        
