---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:

  # -----------------------------------------------
  # Cosmic Ext repository
  # -----------------------------------------------

  - type: dnf
    repos:
      copr:
        - ligenix/cosmic-ext


  # -----------------------------------------------
  # Terra repository
  # -----------------------------------------------

  - type: dnf
    repos:
      files:
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo        


  # -----------------------------------------------
  # Desktop packages
  # -----------------------------------------------

  - type: dnf
    install:
      install-weak-deps: false
      packages:

        # Basic
        - cosmic-settings-daemon
        - cosmic-files                  # Файлы
        - cosmic-term                   # Терминал
        # -                               # Архивы
        - cosmic-ext-calculator         # Калькулятор
        - cosmic-edit                   # Блокнот
        # -                               # Часы и будильник
        - cosmic-ext-xcalendar          # Календарь
        # - cosmic-ext-tasks              # Задачи
        # -                               # Иконки
        # -                               # Карты
        # -                               # Заметки

        # Media
        - cosmic-viewer                 # Изображения
        - cosmic-player                 # Видео
        # - cosmic-player                 # Музыка
        - cosmic-ext-camera             # Камера

        # Office
        # - cosmic-reader                 # PDF, DJVu

        # Apps
        - cosmic-store                  # Магазин приложений

        # Tools
        - gucharmap                     # Символы
        # -                               # Шрифты
        # -                               # RDP
        # - cosmic-ext-dirstat            # Использование диска
        # - cosmic-ext-storage            # Диски
        - cosmic-ext-disks              # Диски
        - cosmic-ext-examine            # Система
        - cosmic-monitor                # Мониторинг
      

  # -----------------------------------------------
  # Desktop flatpaks
  # -----------------------------------------------

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:

          # Media
          - io.bassi.Amberol              # Музыка

          # Office
          - org.onlyoffice.desktopeditors # Офис

          # Code
          # -                               # Редактор кода

          # Web
          - org.mozilla.firefox           # Браузер
          - com.getmailspring.Mailspring  # Почта
          - dev.heppen.webapps            # Веб-приложения
          # -                               # Помощник авторизации wifi
