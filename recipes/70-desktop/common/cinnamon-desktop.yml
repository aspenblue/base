---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:

  # -----------------------------------------------
  # Desktop packages
  # -----------------------------------------------

  - type: dnf
    install:
      install-weak-deps: false
      packages:

        # Basic
        - nemo                          # Файлы
        - engrampa                      # Архивы
        # - peazip-gtk3                   # Архивы
        - qalculate-gtk                 # Калькулятор
        - xed                           # Блокнот
        - clockenstein                  # Часы и будильник
        # -                               # Календарь
        # -                               # Задачи
        # -                               # Иконки
        # -                               # Карты
        - sticky                        # Заметки

        # Media
        - xviewer                       # Изображения
        - pix                           # Изображения
        - xplayer                       # Видео
        # -                               # Камера

        # Office
        - xreader                       # PDF, DJVu

        # Web
        - webapp-manager                # Веб-приложения

        # Tools
        - gucharmap                     # Символы
        # -                               # Шрифты
        # -                               # RDP
        # -                               # Использование диска
      

  # -----------------------------------------------
  # Desktop flatpaks
  # -----------------------------------------------

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:

          # Media
          - io.bassi.Amberol              # Музыка

          # Office
          - org.onlyoffice.desktopeditors # Офис

          # Code
          # -                               # Редактор кода

          # Web
          - org.mozilla.firefox           # Браузер
          - com.getmailspring.Mailspring  # Почта
          # -                               # Помощник авторизации wifi

          # Apps
          - io.github.kolunmi.Bazaar      # Магазин приложений

          # Tools
          - org.gnome.Characters          # Символы
          - org.gnome.font-viewer         # Шрифты
          - org.gnome.Connections         # RDP
          - org.gnome.baobab              # Использование диска
