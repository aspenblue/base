---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:

  # -----------------------------------------------
  # System packages
  # -----------------------------------------------

  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - foot


  # -----------------------------------------------
  # Foot - configuration
  # -----------------------------------------------

  - type: files
    files:
      - source: rootfs/foot
        destination: / 