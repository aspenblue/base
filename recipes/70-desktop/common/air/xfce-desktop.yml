---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:

  # -----------------------------------------------
  # Desktop packages
  # -----------------------------------------------

  - type: dnf
    install:
      install-weak-deps: false
      packages:

        # Basic
        - thunar                        # Файлы
        - xfce4-terminal                # Терминал
        - xarchiver                     # Архивы
        - galculator                    # Калькулятор
        - mousepad                      # Блокнот
        # -                               # Часы и будильник
        # - orage                         # Календарь
        # -                               # Задачи
        # -                               # Иконки
        # -                               # Карты
        # - sticky                        # Заметки

        # Media
        - ristretto                     # Изображения
        - audacious                     # Музыка
        - audacious-plugins
        - parole                        # Видео
        - cheese                        # Камера

        # Office
        - xreader                       # PDF, DJVu
        # - atril                         # PDF, DJVu

        # Web
        - webapp-manager                # Веб-приложения

        # Tools
        - gucharmap                     # Символы
        # - mate-character-map            # Символы
        # -                               # Шрифты
        # -                               # RDP
        # - mate-system-tools             # Использование диска
        # - mate-system-monitor           # Мониторинг системы
      

  # -----------------------------------------------
  # Desktop flatpaks
  # -----------------------------------------------

  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        install:

          # Media
          - io.bassi.Amberol              # Музыка

          # Office
          - org.onlyoffice.desktopeditors # Офис

          # Code
          # -                               # Редактор кода

          # Web
          - org.mozilla.firefox           # Браузер
          - com.getmailspring.Mailspring  # Почта
          # -                               # Помощник авторизации wifi

          # Apps
          - io.github.kolunmi.Bazaar      # Магазин приложений
